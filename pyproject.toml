[project]
name = "month1"
version = "0.1.0"
description = "Month 1 of SNAIL: HTTP, Pydantic, async and tests."
readme = "README.md"
authors = [
    { name = "rubengarcianieto" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
month1 = "month1:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

